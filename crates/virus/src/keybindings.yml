ALIASES:
  up: i, arrow_up
  down: k, arrow_down
  left: j, arrow_left
  right: l, arrow_right

NORMAL:
  # Navigation
  ?lines $up: move_up_line ?lines
  ?lines $down: move_down_line ?lines
  ?pages command $up: move_up_page ?pages +half
  ?pages command $down: move_down_page ?pages +half
  command shift $up: move_top
  command shift $down: move_bottom

  ?repeat $left: move_left_smart ?repeat
  ?repeat $right: move_right_smart ?repeat
  command $left: move_start
  command $right: move_end

  # Scroll
  ?pages shift $up: scroll_up_page ?pages +half
  ?pages shift $down: scroll_down_page ?pages +half

  ",": select_smart
  command ,: unselect
  c: copy
  v: paste
  z: undo
  command z: redo
  s: save
  f: files
  q: close

INSERT:

FILES:
  command $up: move_up_line +wrap
  command $down: move_down_line +wrap
  command $right: open
