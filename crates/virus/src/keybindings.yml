ALIASES:
  up: i, arrow_up
  down: k, arrow_down
  left: j, arrow_left
  right: l, arrow_right

NORMAL:
  ?lines $up: move_up_line ?lines
  ?lines $down: move_down_line ?lines
  ?pages command $up: move_up_page ?pages +half
  ?pages command $down: move_down_page ?pages +half
  command shift $up: move_top
  command shift $down: move_bottom

  ?repeat $left: move_left_smart ?repeat
  ?repeat $right: move_right_smart ?repeat
  command $left: move_start
  command $right: move_end

  ?pages shift $up: scroll_up_page ?pages +half
  ?pages shift $down: scroll_down_page ?pages +half

  ",": select_smart
  ";": unselect
  f: files
  escape: insert

  x: cut
  c: copy
  v: paste
  z: undo
  Z: redo

  s: save
  q: close

INSERT:
  command $up: move_up_line
  command $down: move_down_line
  command $left: move_left_smart
  command $right: move_right_smart

  command ,: select_smart
  command ;: unselect
  command f: files
  escape: normal

  command x: cut
  command c: copy
  command v: paste
  command z: undo
  command Z: redo

  command s: save
  command q: close

FILES:
  command $up: move_up_line +wrap
  command $down: move_down_line +wrap
  command $right: open

  escape: normal
