ALIASES:
  ↑: i, arrow_up
  ↓: k, arrow_down
  ←: j, arrow_left
  →: l, arrow_right

NORMAL:
  command shift $↑: move_↑↑
  command shift $↓: move_↓↓
  ?pages command $↑: move_↑_page ?pages +half
  ?pages command $↓: move_↓_page ?pages +half
  ?lines $↑: move_↑_line ?lines
  ?lines $↓: move_↓_line ?lines

  command $←: move_start
  command $→: move_end
  ?repeat $←: move_←_🧠 ?repeat
  ?repeat $→: move_→_🧠 ?repeat

  ?pages shift $↑: scroll_↑_page ?pages +half
  ?pages shift $↓: scroll_↓_page ?pages +half
  e:
    z: scroll_align_↑↑ margin=3
    e: scroll_align_center
    r: scroll_align_↓↓ margin=3

  escape: insert
  ",": select_🧠
  ";": unselect
  ?repeat :: select_forward ?repeat +wrap
  ?repeat shift :: select_backward ?repeat +wrap

  x: cut
  c: copy
  v: paste
  z: undo
  Z: redo

  space:
    f: files
    s: save
    q: close
    a:
      stick: true
      ?count $↑: move_ast_prev   ?count +paren +square +curly +angle +pipe +single +double +back +wrap
      ?count $↓: move_ast_next   ?count +paren +square +curly +angle +pipe +single +double +back +wrap
      ?count $←: move_ast_parent ?count +paren +square +curly +angle +pipe +single +double +back
      ?count $→: move_ast_child  ?count +paren +square +curly +angle +pipe +single +double +back +wrap
      ",": select_🧠
      ";": unstick
      escape: unstick

  a:
    $↑: panes_focus_first
    $↓: panes_focus_last
    $←: panes_focus_prev +wrap
    $→: panes_focus_next +wrap
    command $↑: panes_swap_first
    command $↓: panes_swap_last
    command $←: panes_swap_prev +wrap
    command $→: panes_swap_next +wrap
    c: panes_close
    C: panes_close_others
    o:
      $↑: panes_open_first
      $↓: panes_open_last
      $←: panes_open_prev
      $→: panes_open_next

INSERT:
  command $↑: move_↑_line
  command $↓: move_↓_line
  command $←: move_←_🧠
  command $→: move_→_🧠

  escape: normal
  command ,: select_🧠
  command ;: unselect
  ?repeat command :: select_forward ?repeat +wrap
  ?repeat command shift :: select_backward ?repeat +wrap

  command x: cut
  command c: copy
  command v: paste
  command z: undo
  command Z: redo

  command space:
    f: files
    s: save
    q: close

FILES:
  command $↑: move_↑_line +wrap
  command $↓: move_↓_line +wrap
  command $→: panes_open_last

  escape: normal
