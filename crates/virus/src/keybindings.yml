ALIASES:
  ↑: i, arrow_up
  ↓: k, arrow_down
  ←: j, arrow_left
  →: l, arrow_right

NORMAL:
  command shift $↑: move_top
  command shift $↓: move_bottom
  ?pages command $↑: move_up_page   ?pages +half
  ?pages command $↓: move_down_page ?pages +half
  ?lines $↑: move_up_line   ?lines
  ?lines $↓: move_down_line ?lines

  command $←: move_start
  command $→: move_end
  ?repeat $←: move_left_smart  ?repeat
  ?repeat $→: move_right_smart ?repeat

  ?pages shift $↑: scroll_up_page   ?pages +half
  ?pages shift $↓: scroll_down_page ?pages +half
  e:
    z: scroll_align_top    margin=3
    e: scroll_align_center
    r: scroll_align_bottom margin=3

  escape: insert
  ",": select_smart
  ";": unselect

  x: cut
  c: copy
  v: paste
  z: undo
  Z: redo

  space:
    f: files
    s: save
    q: close

INSERT:
  command $↑: move_up_line
  command $↓: move_down_line
  command $←: move_left_smart
  command $→: move_right_smart

  escape: normal
  command ,: select_smart
  command ;: unselect

  command x: cut
  command c: copy
  command v: paste
  command z: undo
  command Z: redo

  command space:
    f: files
    s: save
    q: close

FILES:
  command $↑: move_up_line   +wrap
  command $↓: move_down_line +wrap
  command $→: open

  escape: normal
