ALIASES:
  up: i, arrow_up
  down: k, arrow_down
  left: j, arrow_left
  right: l, arrow_right

NORMAL:
  # Navigation
  ?lines $up: move_up_line ?lines
  ?lines $down: move_down_line ?lines
  ?pages command $up: move_up_page ?pages +half
  ?pages command $down: move_down_page ?pages +half
  command shift $up: move_top
  command shift $down: move_bottom
  ?chars $left: move_left_char ?chars
  ?chars $right: move_right_char ?chars
  ?words command $left: move_left_word ?words +symbols +sub
  ?words command $right: move_right_word ?words +symbols +sub
  command shift $left: move_start
  command shift $right: move_end

  # Scroll
  ?pages shift $up: scroll_up_page ?pages +half
  ?pages shift $down: scroll_down_page ?pages +half

  v: select
  command c: copy
  command v: paste
  command z: undo
  command Z: redo
  command s: save
  command f: files
  command q: close

# SELECT:
#   v: select

# LINES:
#   v: select

# INSERT:

FILES:
  command $up: move_up_line +wrap
  command $down: move_down_line +wrap
  command $right: open
