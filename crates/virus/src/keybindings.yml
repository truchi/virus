ALIASES:
  ↑: i, arrow_up
  ↓: k, arrow_down
  ←: j, arrow_left
  →: l, arrow_right

NORMAL:
  command shift $↑: move_↑↑
  command shift $↓: move_↓↓
  ?pages command $↑: move_↑_page ?pages +half
  ?pages command $↓: move_↓_page ?pages +half
  ?lines $↑: move_↑_line ?lines
  ?lines $↓: move_↓_line ?lines

  command $←: move_start
  command $→: move_end
  ?repeat $←: move_←_🧠 ?repeat
  ?repeat $→: move_→_🧠 ?repeat

  ?pages shift $↑: scroll_↑_page ?pages +half
  ?pages shift $↓: scroll_↓_page ?pages +half
  e:
    z: scroll_align_↑↑ margin=3
    e: scroll_align_center
    r: scroll_align_↓↓ margin=3

  escape: insert
  ",": select_🧠
  ";": unselect

  x: cut
  c: copy
  v: paste
  z: undo
  Z: redo

  space:
    f: files
    s: save
    q: close

INSERT:
  command $↑: move_↑_line
  command $↓: move_↓_line
  command $←: move_←_🧠
  command $→: move_→_🧠

  escape: normal
  command ,: select_🧠
  command ;: unselect

  command x: cut
  command c: copy
  command v: paste
  command z: undo
  command Z: redo

  command space:
    f: files
    s: save
    q: close

FILES:
  command $↑: move_↑_line +wrap
  command $↓: move_↓_line +wrap
  command $→: open

  escape: normal
