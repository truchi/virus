[workspace]
resolver = "2"                     # Important! wgpu needs this!
default-members = ["crates/virus"]
members = ["crates/*"]
exclude = ["xtask"]

[workspace.package]
authors = ["Romain TRUCHI"]
edition = "2021"

[workspace.dependencies]
virus-editor = { path = "crates/editor", package = "editor" }
virus-graphics = { path = "crates/graphics", package = "graphics" }
virus-ui = { path = "crates/ui", package = "ui" }

bitflags = "2.6"
bytemuck = "1.16"
futures = "0.3"
ignore = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
lru = "0.12"
notify = "7.0"
pollster = "0.3"
ropey = { version = "1.6", default-features = false, features = ["cr_lines", "simd"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9.34" # NOTE: deprecated!
smol_str = { version = "0.3", features = ["serde"] }
swash = "0.1"
tempfile = "3.14.0"
thiserror = "2.0.3"
tree-sitter = "0.22"
tree-sitter-rust = "0.21"
tween = "2.0"
unicode-properties = "0.1"
unicode-segmentation = "1.12"
unicode-width = "0.1"
url = "2.5"
wgpu = "0.20"
winit = "0.30"

[profile.dev]
# Remove debug stuff in the binary
debug = false
strip = true

# Trying to improve dev performance, but I don't see any effects...
[profile.dev.package."*"]
debug = false
strip = true
opt-level = 3
debug-assertions = false
overflow-checks = false
codegen-units = 16
